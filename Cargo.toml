[package]
name = "podmesh-windows-mount"
version = "2.4.1"
edition = "2021"
description = "PodMesh Windows Native Drive Mount Utility (Z:\\) via WinFsp FUSE & 4MB CAS (Userland-First + Optional Global Mode)"
license = "Apache-2.0"
authors = ["Xavier <xavdp-pro>"]

[[bin]]
name = "podmesh-windows-mount"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
